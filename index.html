<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pothole Guard — Drive Safe</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <header class="app-header">
      <h1>🛣️ Pothole Guard</h1>
      <div class="actions">
        <input id="placeSearch" type="text" placeholder="Search a place" style="padding:6px 10px;border:1px solid #374151;background:#111827;color:#e5e7eb;border-radius:6px;min-width:180px;" />
        <button id="placeSearchBtn" title="Search by place">Search</button>
        <button id="locateMeBtn" title="Center on my location">My location</button>
        <button id="dropPinBtn" title="Place a draggable pin at map center">Place pin</button>
        <button id="addPotholeBtn" title="Add pothole at map center">Report at center</button>
        <input id="fromPlace" type="text" placeholder="From" style="padding:6px 10px;border:1px solid #374151;background:#111827;color:#e2e8f0;border-radius:6px;min-width:160px;" />
        <span style="color:#94a3b8">→</span>
        <input id="toPlace" type="text" placeholder="To" style="padding:6px 10px;border:1px solid #374151;background:#111827;color:#e5e7f0;border-radius:6px;min-width:160px;" />
        <button id="routeBtn" title="Route from my location">Route</button>
        <label class="toggle"><input type="checkbox" id="liveToggle" /> <span>Live</span></label>
        <span id="routeBadge" style="margin-left:6px;font-size:12px;color:#e2e8f0;"></span>
        <button id="fitReportsBtn" title="Zoom to all my reports">Fit reports</button>
        <button id="exportBtn" title="Export reports as JSON">Export</button>
        <label class="toggle">
          <input type="checkbox" id="alertsToggle" checked />
          <span>Alerts</span>
        </label>
      </div>
    </header>

    <main class="layout">
      <div id="map"></div>

      <aside class="sidebar">
        <h2>Report a pothole</h2>
        <form id="reportForm">

          <div class="field">
            <label for="severity">Severity</label>
            <select id="severity" required>
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="field">
            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Any details (depth, lane, etc.)"></textarea>
          </div>

          <div class="field">
            <label for="photo">Photo (required)</label>
            <input id="photo" type="file" accept="image/*;capture=camera" required />
          </div>


          <div class="field">
            <label for="radius">Alert radius (m)</label>
            <input id="radius" type="number" min="25" step="25" value="150" />
          </div>

          <button type="submit" class="primary">Save report</button>
        </form>

        <h2>My reports</h2>
        <ul id="reportsList" class="reports"></ul>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- AI Chat Widget -->
    <div id="aiChat" class="ai-chat" aria-hidden="false">
      <button id="aiToggle" class="ai-toggle" title="Open AI assistant">🤖</button>
      <div id="aiPanel" class="ai-panel" hidden>
        <header class="ai-header">
          <strong>Assistant</strong>
          <button id="aiClose" aria-label="Close">✖</button>
        </header>
        <div id="aiMessages" class="ai-messages" role="log" aria-live="polite"></div>
        <form id="aiForm" class="ai-form">
          <input id="aiInput" type="text" placeholder="Ask about routing, reports, or driving tips..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="ai.js"></script>
  </body>
  </html>
